<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundbox QR</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007bff">
</head>
<body>
  <div class="card">
    <h1>Soundbox QR <span onclick="openSettings()">⚙️</span></h1>
    <label>ENTER BILL AMOUNT</label>
    <input type="number" id="amount-input" placeholder="₹ 0">
    <button id="generate-btn" onclick="generateQR()">GENERATE QR</button>
    <div id="qr-code"></div>
    <div class="amount-display" id="amount-display"></div>
  </div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js")
        .then(() => console.log("Service Worker registered"))
        .catch(err => console.error("SW registration failed:", err));
    }
  </script>
</body>
</html>
